name: Beredskap Spatial Contract
on:
  push:
    branches:
      - spatial/qgis-heby-uppsala-v1
    paths:
      - 'spatial/**'
      - '.github/workflows/spatial-contract.yml'
  pull_request:
    paths:
      - 'spatial/**'
      - '.github/workflows/spatial-contract.yml'
permissions:
  contents: read
jobs:
  static-spatial-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile validator
        run: python -m py_compile spatial/scripts/validate_spatial.py
      - name: Static atlas, source, job and FFOS handoff checks
        run: python spatial/scripts/validate_spatial.py
